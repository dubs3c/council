[project]
name = "council"
version = "0.1.0"
description = "Multi-agent discussion system for reaching consensus through structured debate"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pocketflow>=0.0.1",
    "openai>=1.14.0",
    "pyyaml>=6.0",
    "rich>=15.0.0",
]

keywords = ["ai", "agents", "agentic"]
license = "MIT"

[project.urls]
Homepage = "https://github.com/dubs3c/council"
Repository = "https://github.com/dubs3c/council.git"

[project.scripts]
council = "council.main:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "ruff>=0.14.10",
]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["--import-mode=importlib"]
